<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3D-комната и шкаф</title>
<style>
:root{--bg:#15181c;--panel:#1d2126;--line:#2c3238;--txt:#e6e8ea;--mut:#9aa3ab;--acc:#3fb6a8;--warn:#f0b43c;--err:#ef6a5a}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--txt);font:14px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
#app{display:grid;grid-template-columns:340px 1fr;height:100vh}
#panel{background:var(--panel);border-right:1px solid var(--line);overflow:auto;padding:14px 14px 40px}
#view{position:relative;overflow:hidden}
#view canvas{display:block;width:100%;height:100%}
h1{font-size:17px;margin:0 0 4px}
h2{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--mut);margin:18px 0 8px}
.note{font-size:12px;color:var(--mut);background:#252a30;border-left:3px solid var(--warn);padding:6px 8px;border-radius:4px;margin-bottom:8px}
.row{display:grid;grid-template-columns:1fr 64px;gap:6px;align-items:center;margin:6px 0}
.row label{font-size:12.5px;color:#c9ced3}
.row input[type=range]{grid-column:1/3;width:100%;accent-color:var(--acc);margin:0}
.row input[type=number]{width:64px;background:#111417;border:1px solid var(--line);color:var(--txt);border-radius:4px;padding:3px 4px;text-align:right}
.sel{display:grid;grid-template-columns:1fr 1.3fr;gap:6px;align-items:center;margin:7px 0}
.sel label{font-size:12.5px;color:#c9ced3}
select{background:#111417;color:var(--txt);border:1px solid var(--line);border-radius:4px;padding:4px}
.chk{display:flex;gap:8px;align-items:center;margin:6px 0;font-size:13px}
.chk input{accent-color:var(--acc)}
button{background:#2a3037;color:var(--txt);border:1px solid #3a424a;border-radius:6px;padding:6px 10px;cursor:pointer;font:inherit;font-size:13px}
button:hover{border-color:var(--acc)}
button.on{background:var(--acc);border-color:var(--acc);color:#0d1a18}
#toolbar{position:absolute;top:10px;left:10px;right:10px;display:flex;gap:6px;flex-wrap:wrap;pointer-events:none}
#toolbar>*{pointer-events:auto}
#toolbar .grp{display:flex;gap:4px;background:rgba(20,24,28,.75);padding:4px;border-radius:8px;backdrop-filter:blur(4px)}
#hud{position:absolute;left:10px;bottom:10px;max-width:min(520px,calc(100% - 20px));max-height:30%;overflow:auto;display:flex;flex-direction:column;gap:5px}
.msg{background:rgba(20,24,28,.88);border-left:3px solid var(--acc);padding:6px 9px;border-radius:5px;font-size:12.5px}
.msg.w{border-color:var(--warn)}.msg.e{border-color:var(--err)}
table{width:100%;border-collapse:collapse;font-size:12px;margin-top:6px}
td,th{border-bottom:1px solid var(--line);padding:3px 4px;text-align:left}
th{color:var(--mut);font-weight:600}
td.n{text-align:right;white-space:nowrap}
details{margin-top:6px}
summary{cursor:pointer;color:var(--acc)}
#secs .sel label{color:var(--mut)}
textarea{width:100%;height:120px;background:#111417;color:var(--txt);border:1px solid var(--line);font-size:11px}
@media (max-width:800px){#app{grid-template-columns:1fr;grid-template-rows:58vh 1fr;height:auto;min-height:100vh}#view{order:1;height:58vh}#panel{order:2;border-right:0}}
</style>
</head>
<body>
<div id="app">
  <aside id="panel">
    <h1>Комната и шкаф в 3D</h1>
    <div style="font-size:12px;color:var(--mut)">Крути мышкой, колесо — зум, правая кнопка — сдвиг.</div>
    <div id="form"></div>
    <h2>Проверки</h2>
    <div id="checks"></div>
    <h2>Спецификация шкафа</h2>
    <div id="spec"></div>
    <div style="display:flex;gap:6px;margin-top:8px;flex-wrap:wrap">
      <button id="copy">Скопировать для мебельщика</button>
      <button id="reset">Сбросить всё</button>
    </div>
    <div id="copyBox"></div>
  </aside>
  <main id="view">
    <div id="toolbar">
      <div class="grp"><button data-cam="entry">От входа</button><button data-cam="top">Сверху</button><button data-cam="wr">На шкаф</button><button data-cam="win">От окна</button></div>
      <div class="grp"><button data-door="closed">Двери закрыты</button><button data-door="open">Открыты</button><button data-door="hidden">Без дверей</button></div>
      <div class="grp" id="deskGrp" style="align-items:center"><button id="deskBtn">▶ Разложить стол</button><input id="deskR" type="range" min="0" max="100" value="0" style="width:140px;accent-color:var(--acc)"></div>
    </div>
    <div id="hud"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const CM=0.01, T=0.016;
const TYPES={rodLong:'Штанга (пальто, платья)',rod:'Штанга + полка (рубашки)',rodDrawers:'Ящики + штанга',shelves:'Полки',drawersShelves:'Ящики + полки'};
const DEF_TYPES=['rodLong','shelves','rodDrawers','rod','drawersShelves','shelves'];
const COLORS={white:['Белый',0xf1f1ee],oak:['Дуб светлый',0xd6bf98],beige:['Кашемир',0xe0d5c4],grey:['Серый',0x9ea4a8],graphite:['Графит',0x4a4e52]};

function defaults(){return {v:12,
  room:{mir:false,W:254,H:257,dW:74,dFrom:0,dH:215,lWall:83.5,lStep:20,rWin:30,rStep:10,rWall:130,rJut:63,entr:42,openH:245,sill:55},
  wr:{design:'proj',rw:60,robot:65,gap:15,oven:46,deskY:72.5,flap:180,segs:1,deskT:2.5,wall:'right',off:0,w:130,h:256,d:63,n:2,types:['rodLong','drawersShelves'],doors:'hinged',color:'white',mezz:true,plinth:true,mirror:false},
  f:{wr:true,desk:false,chair:false,curtains:true,clothes:true},door:'closed'};}
let S=null; try{S=JSON.parse(localStorage.getItem('wr3d'));}catch(e){}
if(!S||S.v!==12) S=defaults();
S.wr.segs=1;
const SWP={'Лев':'Прав','Прав':'Лев','лев':'прав','прав':'лев','Слева':'Справа','Справа':'Слева','слева':'справа','справа':'слева','налево':'направо','направо':'налево'};
const sw=t=>S.room.mir?String(t).replace(/(?<![А-Яа-яЁё])(Лев|Прав|лев|прав|Слева|Справа|слева|справа|налево|направо)/g,m=>SWP[m]):t;
/* планировка (метры): x — вдоль окна слева направо, z — от входа (0) к окну (Zw) */
function lay(){const R=S.room,c=v=>v*CM;const W=c(R.W),H=c(R.H),dW=c(R.dW),dF=c(R.dFrom);
  const lMain=dF+dW+c(R.lWall),rMain=c(R.rWin)+c(R.rWall),entr=c(R.entr);
  const Zw=Math.max(lMain,rMain)+entr,ZL=Zw-lMain,Zr=Zw-rMain;
  const xL=c(R.lStep),xRW=W-c(R.rStep),xR=xRW-c(R.rJut),zN=Zw-c(R.rWin);
  return{W,H,Zw,ZL,Zr,xL,xR,xRW,zN,dW,dF,dz0:Zw-dF-dW,dz1:Zw-dF};}
function walls(){const R=S.room;const L=lay();
  return{right:{len:R.rWall,name:'Правая стена (130)'},left:{len:R.lWall,name:'Левая, между дверью и уступом'},face:{len:R.rJut,name:'Торец выступа справа (лицом к окну)'}};}
const save=()=>{try{localStorage.setItem('wr3d',JSON.stringify(S));}catch(e){}};
const get=p=>p.split('.').reduce((o,k)=>o[k],S);
const set=(p,v)=>{const ks=p.split('.');let o=S;for(let i=0;i<ks.length-1;i++)o=o[ks[i]];o[ks[ks.length-1]]=v;};

/* ---------- three setup ---------- */
const view=document.getElementById('view');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(window.devicePixelRatio||1,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;
view.prepend(renderer.domElement);
const scene=new THREE.Scene(); scene.background=new THREE.Color(0x14171b);
const camera=new THREE.PerspectiveCamera(58,1,0.03,100);
const controls=new THREE.OrbitControls(camera,renderer.domElement);
controls.enableDamping=true; controls.dampingFactor=0.12; controls.maxDistance=12;
scene.add(new THREE.HemisphereLight(0xffffff,0x9a9084,0.62));
scene.add(new THREE.AmbientLight(0xffffff,0.12));
const sun=new THREE.DirectionalLight(0xfff6ea,0.42);
sun.castShadow=true; sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-3,right:3,top:3,bottom:-3,near:0.1,far:12}); sun.shadow.bias=-0.0006;
scene.add(sun); scene.add(sun.target);

function std(c,r=0.85,m=0){return new THREE.MeshStandardMaterial({color:c,roughness:r,metalness:m});}
function canvasTex(w,h,draw){const c=document.createElement('canvas');c.width=w;c.height=h;draw(c.getContext('2d'),w,h);const t=new THREE.CanvasTexture(c);t.encoding=THREE.sRGBEncoding;t.wrapS=t.wrapT=THREE.RepeatWrapping;t.anisotropy=4;return t;}
const floorTex=canvasTex(512,512,(x,w,h)=>{x.fillStyle='#d9d6d0';x.fillRect(0,0,w,h);
  for(let i=0;i<4;i++){const y=i*h/4,off=(i%2)*w/2;for(let k=0;k<400;k++){x.fillStyle=`rgba(${150+Math.random()*40|0},${145+Math.random()*40|0},${135+Math.random()*40|0},.08)`;x.fillRect(Math.random()*w,y+Math.random()*h/4,40+Math.random()*120,1.5);}
  x.fillStyle='rgba(120,115,108,.45)';x.fillRect(0,y,w,2);x.fillRect(off,y,2,h/4);}});
const oakTex=canvasTex(256,512,(x,w,h)=>{x.fillStyle='#d8c19b';x.fillRect(0,0,w,h);for(let k=0;k<160;k++){x.strokeStyle=`rgba(${140+Math.random()*40|0},${105+Math.random()*30|0},${70},.18)`;x.lineWidth=0.6+Math.random()*1.6;const px=Math.random()*w;x.beginPath();x.moveTo(px,0);x.bezierCurveTo(px+8,h*.3,px-8,h*.6,px+4,h);x.stroke();}});
const M={
  wall:std(0xe9e6e1,0.95), ceil:std(0xf6f6f4,0.9), floor:new THREE.MeshStandardMaterial({map:floorTex,roughness:0.8}),
  outFloor:std(0x9d9a95,0.9), frame:std(0xf4f4f2,0.45), sill:std(0xf7f7f5,0.4),
  glass:new THREE.MeshStandardMaterial({color:0x1b2633,roughness:0.08,metalness:0.3,transparent:true,opacity:0.7}),
  blind:std(0x9c9ea6,0.9), curtain:std(0xb7aea5,1), sheer:new THREE.MeshStandardMaterial({color:0xf2f2f0,roughness:1,transparent:true,opacity:0.55}),
  desk:std(0xf2f2f0,0.55), teal:std(0x2e8580,0.95), legW:std(0xeeeeee,0.5), metal:std(0xbfc4c8,0.3,0.8),
  back:std(0xdddcd8,0.9), mirror:std(0xc9d3da,0.06,0.55), dark:std(0x2a2c2f,0.6), outlet:std(0xfafafa,0.5)
};
const cmat={};
function carcassMat(key){ if(cmat[key]) return cmat[key];
  const m = key==='oak'? new THREE.MeshStandardMaterial({map:oakTex,roughness:0.7}) : std(COLORS[key][1],0.6);
  return cmat[key]=m; }

function box(w,h,d,mat,x,y,z,shadow=true){const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),mat);m.position.set(x,y,z);m.castShadow=shadow;m.receiveShadow=true;return m;}
function label(text){const c=document.createElement('canvas');c.width=256;c.height=72;const x=c.getContext('2d');
  x.fillStyle='rgba(18,22,26,.85)';x.beginPath();if(x.roundRect)x.roundRect(4,4,248,64,14);else x.rect(4,4,248,64);x.fill();
  x.fillStyle='#ffffff';x.font='bold 36px system-ui,sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,38);
  const t=new THREE.CanvasTexture(c);const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:t,depthTest:false,transparent:true}));
  sp.scale.set(0.34,0.095,1);sp.renderOrder=10;sp.userData.own=true;return sp;}

/* ---------- room ---------- */
const world=new THREE.Group();scene.add(world);let roomG=new THREE.Group(), wrG=new THREE.Group(); world.add(roomG,wrG);
function wallGroup(len,H,ops){const g=new THREE.Group();ops=ops.slice().sort((a,b)=>a.u0-b.u0);
  const piece=(u0,u1,v0,v1)=>{if(u1-u0<1e-4||v1-v0<1e-4)return;const m=new THREE.Mesh(new THREE.PlaneGeometry(u1-u0,v1-v0),M.wall);m.position.set((u0+u1)/2,(v0+v1)/2,0);m.receiveShadow=true;g.add(m);};
  let u=0;for(const o of ops){piece(u,o.u0,0,H);piece(o.u0,o.u1,0,o.v0);piece(o.u0,o.u1,o.v1,H);u=o.u1;}piece(u,len,0,H);return g;}
function dispose(g){g.traverse(o=>{if(o.geometry)o.geometry.dispose();if(o.userData.own&&o.material){if(o.material.map)o.material.map.dispose();o.material.dispose();}});}

function chair(x,z,rot){const g=new THREE.Group();
  g.add(box(0.44,0.07,0.44,M.teal,0,0.47,0));g.add(box(0.42,0.5,0.07,M.teal,0,0.78,-0.21));
  for(const[sx,sz]of[[-1,-1],[1,-1],[-1,1],[1,1]]){const l=box(0.025,0.47,0.025,M.legW,sx*0.19,0.235,sz*0.19);l.rotation.z=sx*0.08;l.rotation.x=-sz*0.08;g.add(l);}
  g.position.set(x,0,z);g.rotation.y=rot;return g;}

function buildRoom(){
  world.remove(roomG);dispose(roomG);roomG=new THREE.Group();world.add(roomG);
  const R=S.room,Y=lay(),W=Y.W,H=Y.H,L=Y.Zw,oH=Math.min(R.openH*CM,H),sill=R.sill*CM;
  const dF=Y.dF,dW=Y.dW,dH=Math.min(R.dH*CM,H-0.05),dTop=Math.min(H-0.08,dH+0.38);
  // polygon (обход так, что нормаль стены смотрит внутрь)
  const P=[[W,L],[0,L],[0,Y.ZL],[Y.xL,Y.ZL],[Y.xL,0],[Y.xR,0],[Y.xR,Y.Zr],[Y.xRW,Y.Zr],[Y.xRW,Y.zN],[W,Y.zN],[W,L]];
  // floor / ceiling
  const shp=s=>{const sh=new THREE.Shape();P.slice(0,-1).forEach(([x,z],i)=>i?sh.lineTo(x,s*z):sh.moveTo(x,s*z));return sh;};
  floorTex.repeat.set(1/1.2,1/0.8);
  const fl=new THREE.Mesh(new THREE.ShapeGeometry(shp(-1)),M.floor);fl.rotation.x=-Math.PI/2;fl.receiveShadow=true;roomG.add(fl);
  const of=new THREE.Mesh(new THREE.PlaneGeometry(W+1.5,2.2),M.outFloor);of.rotation.x=-Math.PI/2;of.position.set(W/2,-0.001,-1.1);roomG.add(of);
  const ce=new THREE.Mesh(new THREE.ShapeGeometry(shp(1)),M.ceil);ce.rotation.x=Math.PI/2;ce.position.y=H;roomG.add(ce);
  // walls
  const win={u0:0.1,u1:W-0.1,v0:sill,v1:H-0.1};
  for(let i=0;i<P.length-1;i++){const[ax,az]=P[i],[bx,bz]=P[i+1];const len=Math.hypot(bx-ax,bz-az);if(len<1e-4)continue;
    const ux=(bx-ax)/len,uz=(bz-az)/len;let ops=[];
    if(i===0)ops=[win];
    if(i===1)ops=[{u0:dF,u1:dF+dW,v0:0,v1:dTop}];
    if(i===4)ops=[{u0:0,u1:len,v0:0,v1:oH}];
    const g=wallGroup(len,H,ops);g.rotation.y=Math.atan2(-uz,ux);g.position.set(ax,0,az);roomG.add(g);}
  // reveals of entrance opening
  const rv=(w,h,d,x,y,z)=>roomG.add(box(w,h,d,M.wall,x,y,z,false));
  rv(Y.xR-Y.xL,0.002,0.12,(Y.xL+Y.xR)/2,oH,-0.06);
  for(const [x0,x1] of [[-0.6,Y.xL],[Y.xR,W+0.6]]){const m=new THREE.Mesh(new THREE.PlaneGeometry(x1-x0,H),M.wall);m.position.set((x0+x1)/2,H/2,-0.0005);m.rotation.y=Math.PI;roomG.add(m);}
  // window
  const wx0=win.u0,wx1=win.u1,wy0=sill,wy1=H-0.1,zw=L+0.03,fw=0.06;
  roomG.add(box(W-0.2,0.03,0.26,M.sill,W/2,sill-0.015,L-0.07));
  rv(0.002,wy1-wy0,0.08,wx0,(wy0+wy1)/2,L+0.03);rv(0.002,wy1-wy0,0.08,wx1,(wy0+wy1)/2,L+0.03);rv(wx1-wx0,0.002,0.08,W/2,wy1,L+0.03);
  const glass=new THREE.Mesh(new THREE.PlaneGeometry(wx1-wx0,wy1-wy0),M.glass);glass.rotation.y=Math.PI;glass.position.set(W/2,(wy0+wy1)/2,zw+0.02);roomG.add(glass);
  const fr=(w,h,x,y)=>roomG.add(box(w,h,0.07,M.frame,x,y,zw,false));
  fr(wx1-wx0,fw,W/2,wy0+fw/2);fr(wx1-wx0,fw,W/2,wy1-fw/2);fr(fw,wy1-wy0,wx0+fw/2,(wy0+wy1)/2);fr(fw,wy1-wy0,wx1-fw/2,(wy0+wy1)/2);
  const hy=wy0+(wy1-wy0)*0.38;fr(wx1-wx0,fw,W/2,hy);
  for(const k of[0.3,0.7]){const x=wx0+(wx1-wx0)*k;fr(fw,wy1-wy0,x,(wy0+wy1)/2);}
  roomG.add(box(0.015,0.12,0.03,M.frame,wx0+(wx1-wx0)*0.31+0.03,hy+0.5,zw-0.05,false));
  // balcony door (left wall)
  const z1=L-dF,z0=z1-dW;
  rv(0.12,dTop,0.002,-0.06,dTop/2,z0);rv(0.12,dTop,0.002,-0.06,dTop/2,z1);rv(0.12,0.002,dW,-0.06,dTop,(z0+z1)/2);
  const dfr=(h,d,y,z)=>roomG.add(box(0.07,h,d,M.frame,-0.04,y,z,false));
  dfr(dTop,0.06,dTop/2,z0+0.03);dfr(dTop,0.06,dTop/2,z1-0.03);dfr(0.07,dW,dTop-0.035,(z0+z1)/2);dfr(0.07,dW,dH,(z0+z1)/2);dfr(0.06,dW,0.03,(z0+z1)/2);
  const bl=new THREE.Mesh(new THREE.PlaneGeometry(dW-0.14,dH-0.14),M.blind);bl.rotation.y=Math.PI/2;bl.position.set(-0.005,dH/2,(z0+z1)/2);roomG.add(bl);
  const gl=new THREE.Mesh(new THREE.PlaneGeometry(dW-0.12,dTop-dH-0.1),M.glass);gl.rotation.y=Math.PI/2;gl.position.set(-0.03,(dH+dTop)/2,(z0+z1)/2);roomG.add(gl);
  roomG.add(box(0.03,0.13,0.02,M.frame,0.01,1.0,z1-0.1,false));
  // outlets on right wall + switch near entrance
  for(const dz of[0,0.08])roomG.add(box(0.012,0.08,0.075,M.outlet,Y.xRW-0.006,0.3,Y.zN-0.12-dz,false));
  for(const y of[0.95,1.07])roomG.add(box(0.012,0.085,0.085,M.outlet,Y.xL+0.006,y,0.2,false));
  // ceiling spots + lights
  for(const [x,z] of[[W/2-0.42,L*0.62],[W/2+0.42,L*0.62]]){const s=new THREE.Mesh(new THREE.CircleGeometry(0.07,24),new THREE.MeshBasicMaterial({color:0xfffbf0}));s.rotation.x=Math.PI/2;s.position.set(x,H-0.002,z);roomG.add(s);
    const pl=new THREE.PointLight(0xfff3e2,0.38,5.5,1.6);pl.position.set(x,H-0.08,z);roomG.add(pl);}
  world.scale.x=R.mir?1:-1;world.position.x=R.mir?0:W;
  sun.position.set(W*0.6,H+1.5,L*0.35);sun.target.position.set(W/2,0,L/2);
  // furniture
  const F=S.f;
  if(F.desk){const W=Y.xRW;const dx0=Math.max(0.05,W-1.1),dw=W-dx0,dz=L-0.27;
    roomG.add(box(dw,0.025,0.52,M.desk,dx0+dw/2,0.737,dz));
    roomG.add(box(0.4,0.72,0.48,M.desk,dx0+0.2,0.36,dz));
    for(let i=1;i<4;i++)roomG.add(box(0.396,0.003,0.002,M.back,dx0+0.2,0.18*i,dz-0.241,false));
    roomG.add(box(0.016,0.72,0.48,M.desk,W-0.01,0.36,dz));roomG.add(box(0.016,0.72,0.48,M.desk,W-0.31,0.36,dz));

function cutList(){if(S.wr.design==='proj')return cutProj();const c=S.wr,G=geom(),r=[];const mm=v=>Math.round(v*1000);

Помещение: ширина у окна ${R.W} см, потолок ${R.H} см. Место: ${walls()[c.wall].name}, длина ${walls()[c.wall].len} см, отступ ${c.off} см.

/* ---------- UI ---------- */
const schema=[
 {t:'Комната',items0:[{k:'room.mir',l:'Отзеркалить комнату',chk:1}],note:'Размеры — по вашей схеме. Уступ справа у окна на схеме не подписан, я поставил 10 см: замерьте и поправьте. Высота проёма и низ окна — на глаз по фото.',items:[
  ['room.W','Стена с окном',150,400],['room.H','Высота потолка',220,320],
  ['room.dW','Балк. дверь (слева от окна)',50,120],['room.lWall','Левая стена за дверью',0,300],['room.lStep','Уступ слева',0,100],
  ['room.rWin','Справа у окна',0,100],['room.rStep','Уступ справа у окна',0,50],['room.rWall','Правая стена',0,300],['room.rJut','Выступ справа у входа',0,150],
  ['room.entr','Глубина прохода у входа',0,150],['room.openH','Высота проёма входа',180,320],['room.sill','Низ окна от пола',0,120]]},
 {t:'Шкаф',items:[
  {k:'wr.design',l:'Схема',opts:[['proj','Стол + духовка + робот (ваша)'],['gen','Конструктор секций']]},
  {k:'wr.wall',l:'Место',opts:[['right','Правая стена 130 (ниша)'],['left','Левая, у балк. двери'],['face','Торец выступа 63, лицом к окну']]},
  ['wr.off','Отступ от уступа (со стороны входа)',0,300],['wr.w','Ширина',40,400],['wr.h','Высота',100,320],['wr.d','Глубина',30,80],
  ['wr.rw','Колонна духовки/робота',40,100,'p'],['wr.robot','Ниша робота от пола',30,100,'p'],['wr.gap','Щель под дверью робота',5,30,'p'],['wr.oven','Ниша духовки',30,70,'p'],['wr.deskY','Ось стола (низ столешницы)',60,90,'p'],['wr.flap','Длина столешницы',30,200,'p'],['wr.deskT','Толщина столешницы',1.6,4,'p'],
  ['wr.n','Секций',1,6,'g'],
  {g:1,k:'wr.doors',l:'Двери',opts:[['hinged','Распашные'],['sliding','Купе'],['none','Без дверей']]},
  {k:'wr.color',l:'Цвет',opts:Object.entries(COLORS).map(([k,v])=>[k,v[0]])},
  {g:1,k:'wr.mezz',l:'Антресоль сверху',chk:1},{g:1,k:'wr.plinth',l:'Цоколь 8 см',chk:1},{g:1,k:'wr.mirror',l:'Зеркало на фасаде',chk:1}],extra:'<div id="secs"></div><div style="display:flex;gap:6px;flex-wrap:wrap;margin-top:6px"><button id="toJut">Глубина вровень с выступом</button><button id="toCeil">Высота под потолок</button><button id="toDesk">Стол до стены</button></div>'},
 {t:'Обстановка',items:[{k:'f.wr',l:'Шкаф',chk:1},{k:'f.desk',l:'Столы у окна',chk:1},{k:'f.chair',l:'Стулья',chk:1},{k:'f.curtains',l:'Шторы',chk:1},{k:'f.clothes',l:'Вещи и техника в шкафу',chk:1}]}];
const form=document.getElementById('form');
function buildForm(){let h='';for(const s of schema){h+=`<h2>${s.t}</h2>`;if(s.items0)h+=`<label class="chk"><input type="checkbox" data-k="room.mir">Отзеркалить комнату</label>`;if(s.note)h+=`<div class="note">${sw(s.note)}</div>`;
  const pj=S.wr.design==='proj';
  for(const it of s.items){const fl=Array.isArray(it)?it[4]:(it.g?'g':it.p?'p':'');if((fl==='g'&&pj)||(fl==='p'&&!pj))continue;if(Array.isArray(it)){const[k,l,mn,mx]=it;h+=`<div class="row"><label>${sw(l)}, см</label><input type="number" data-k="${k}" min="${mn}" max="${mx}" step="0.5"><input type="range" step="0.5" data-k="${k}" min="${mn}" max="${mx}"></div>`;}
   else if(it.chk)h+=`<label class="chk"><input type="checkbox" data-k="${it.k}">${sw(it.l)}</label>`;
   else h+=`<div class="sel"><label>${sw(it.l)}</label><select data-k="${it.k}">${it.opts.map(o=>`<option value="${o[0]}">${sw(o[1])}</option>`).join('')}</select></div>`;}
  if(s.extra)h+=s.extra;}
  form.innerHTML=h;
  form.querySelectorAll('[data-k]').forEach(el=>{el.addEventListener('input',()=>{const k=el.dataset.k;let v=el.type==='checkbox'?el.checked:el.tagName==='SELECT'?el.value:Number(el.value);
    if(el.type==='number'||el.type==='range'){if(isNaN(v))return;v=Math.round(v*2)/2;}
    set(k,v);if(k==='room.mir'){buildForm();schedule('all');setTimeout(()=>setCam('entry'));return;}if(k==='wr.design'){buildForm();schedule('wr');return;}if(k==='wr.n')fixTypes();if(k==='wr.wall'){const L=walls()[v].len;S.wr.off=0;if(S.wr.w>L)S.wr.w=Math.floor(L);}syncForm(k==='wr.wall'?null:el);schedule(k.startsWith('room')||k.startsWith('f.')?'all':'wr');});});
  const dm=document.getElementById('toDesk');if(dm)dm.onclick=()=>{S.wr.flap=deskMax();syncForm();schedule('wr');};
  document.getElementById('toJut').onclick=()=>{S.wr.d=S.wr.wall==='left'?S.room.lStep:S.room.rJut;syncForm();schedule('wr');};
  document.getElementById('toCeil').onclick=()=>{const G=geom();const cd=G.cd*100;S.wr.h=Math.min(S.room.H-2,Math.floor(Math.sqrt((S.room.H-1)**2-cd*cd)));syncForm();schedule('wr');};
  syncForm();}
function fixTypes(){const t=S.wr.types;for(let i=t.length;i<S.wr.n;i++)t.push(DEF_TYPES[i%DEF_TYPES.length]);}
function syncForm(skip){form.querySelectorAll('[data-k]').forEach(el=>{if(el===skip)return;const v=get(el.dataset.k);if(el.type==='checkbox')el.checked=!!v;else el.value=v;});
  const sec=document.getElementById('secs');if(S.wr.design==='proj'){sec.innerHTML='';return;}let h='<div style="font-size:12px;color:var(--mut);margin-top:8px">'+sw('Наполнение секций (слева направо, если стоять лицом к шкафу):')+'</div>';
  for(let i=0;i<S.wr.n;i++)h+=`<div class="sel"><label>Секция ${i+1}</label><select data-sec="${i}">${Object.entries(TYPES).map(([k,v])=>`<option value="${k}"${S.wr.types[i]===k?' selected':''}>${v}</option>`).join('')}</select></div>`;
  sec.innerHTML=h;sec.querySelectorAll('[data-sec]').forEach(el=>el.onchange=()=>{S.wr.types[+el.dataset.sec]=el.value;schedule('wr');});}
let pending=null;function schedule(what){pending=(pending==='all'||what==='all')?'all':'wr';}
function rebuild(){if(!pending)return;if(pending==='all')buildRoom();buildWardrobe();renderSpec();renderHud();save();pending=null;}
function renderHud(){const ck=S.f.wr?checks():[];document.getElementById('checks').innerHTML=ck.map(([t,m])=>`<div class="msg ${t==='e'?'e':t==='w'?'w':''}" style="margin:4px 0">${sw(m)}</div>`).join('')||'<div style="font-size:12.5px;color:var(--mut)">—</div>';document.getElementById('hud').innerHTML=ck.filter(x=>x[0]!=='i').map(([t,m])=>`<div class="msg ${t==='e'?'e':t==='w'?'w':''}">${sw(m)}</div>`).join('');}

document.querySelectorAll('[data-door]').forEach(b=>b.onclick=()=>{S.door=b.dataset.door;applyDoorMode(false);save();});
function camTo(p,t){const W=lay().W,m=x=>S.room.mir?x:W-x;camera.position.set(m(p[0]),p[1],p[2]);controls.target.set(m(t[0]),t[1],t[2]);controls.update();}
function setCam(k){const Y=lay(),W=Y.W,L=Y.Zw,H=Y.H;
  document.querySelectorAll('[data-cam]').forEach(b=>b.classList.toggle('on',b.dataset.cam===k));
  const cx=(Y.xL+Y.xR)/2;
  if(k==='entry')camTo([cx,1.75,-1.3],[W/2,1.0,L*0.7]);
  if(k==='top')camTo([W/2,H+3.4,L/2+0.02],[W/2,0,L/2]);
  if(k==='win')camTo([W/2,1.6,L-0.3],[cx,1.1,0.2]);
  if(k==='wr'&&S.wr.wall!=='face'){const f=fpWr(),c=S.wr;const mz=(f.z0+f.z1)/200,fx=(f.n[0]<0?f.x0:f.x1)/100;
    const cxm=f.n[0]<0?Math.max(0.25,Y.xL):Math.min(Y.xRW-0.25,Y.xR);camTo([cxm,1.55,-0.75],[fx,c.h*CM*0.45,mz]);return;}
  if(k==='wr'){const f=fpWr(),c=S.wr;const mx=(f.x0+f.x1)/200,mz=(f.z0+f.z1)/200;const fx=f.n[0]?(f.n[0]<0?f.x0:f.x1)/100:mx,fz=f.n[1]?f.z1/100:mz;
    const dist=f.n[1]?Math.min(1.5,L-fz-0.1):Math.min(1.7,(Y.xRW-c.d*CM)-0.1);
    camTo([fx+f.n[0]*dist,1.4,fz+f.n[1]*dist-(f.n[1]?0:0.15)],[mx,c.h*CM*0.48,mz]);}}
document.querySelectorAll('[data-cam]').forEach(b=>b.onclick=()=>setCam(b.dataset.cam));
document.getElementById('copy').onclick=()=>{const txt=specText();const box_=document.getElementById('copyBox');
  const p=navigator.clipboard&&navigator.clipboard.writeText?navigator.clipboard.writeText(txt):Promise.reject();
  p.then(()=>{box_.innerHTML='<div class="msg" style="margin-top:6px">Скопировано ✓</div>';setTimeout(()=>box_.innerHTML='',2000);})
   .catch(()=>{box_.innerHTML='<textarea readonly></textarea>';const ta=box_.querySelector('textarea');ta.value=txt;ta.select();});};
document.getElementById('reset').onclick=()=>{S=defaults();buildForm();schedule('all');setCam('entry');};

function resize(){const w=view.clientWidth,h=view.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(view);resize();
fixTypes();buildForm();schedule('all');rebuild();setCam('entry');
document.getElementById('deskBtn').onclick=()=>{deskTarget=deskCur>0.5?0:1;};
document.getElementById('deskR').oninput=e=>{deskCur=deskTarget=e.target.value/100;poseDesk(deskCur);};
(function loop(){requestAnimationFrame(loop);rebuild();controls.update();
  if(deskCur!==deskTarget){const st=0.0035;deskCur=Math.abs(deskTarget-deskCur)<st?deskTarget:deskCur+Math.sign(deskTarget-deskCur)*st;poseDesk(deskCur);}
  const db=document.getElementById('deskBtn');if(db){const lbl=deskTarget>0.5?'◀ Сложить стол':'▶ Разложить стол';if(db.textContent!==lbl)db.textContent=lbl;document.getElementById('deskGrp').style.display=(S.wr.design==='proj'&&S.f.wr)?'flex':'none';}
  for(const l of leaves){if(l.mode==='rot')l.piv.rotation.y+=(l.target-l.piv.rotation.y)*0.12;else if(l.mode==='rotx')l.piv.rotation.x+=(l.target-l.piv.rotation.x)*0.12;else l.piv.position.x+=(l.target-l.piv.position.x)*0.12;}
  renderer.render(scene,camera);})();
})();
